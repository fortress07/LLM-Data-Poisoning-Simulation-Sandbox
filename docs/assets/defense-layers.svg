<text x='44.0' y='358.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='10.5' fill='#c6ccd8' text-anchor='start' font-weight='400'>disjoint shards, plurality vote, per prediction radius</text>
<text x='560.0' y='340.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11' fill='#8b93a7' text-anchor='start' font-weight='600'>ASR cut 64%, and a floor that holds against any poison</text>
<text x='450.0' y='386.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11.5' fill='#c6ccd8' text-anchor='middle' font-weight='400'>layers 1 to 3 have to be right about the data. layers 4 and 5 hold whether or not anything was detected.</text>
