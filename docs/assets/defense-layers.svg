<text x='44.0' y='184.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='10.5' fill='#c6ccd8' text-anchor='start' font-weight='400'>purity, contradiction, rarity, confusable, dynamics, spectral, clustering, neighbourhood</text>
<text x='560.0' y='166.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11' fill='#8b93a7' text-anchor='start' font-weight='600'>AUC 0.92 to 0.98 on the best single detector</text>
