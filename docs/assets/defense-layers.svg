<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 400' width='900' height='400' role='img'>
<text x='24.0' y='30.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='14.5' fill='#1c2233' text-anchor='start' font-weight='700'>Defense in depth</text>
<text x='24.0' y='52.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11.5' fill='#525d75' text-anchor='start' font-weight='400'>each layer assumes the one before it failed. the last one does not depend on noticing anything at all.</text>
<rect x='24.0' y='88.0' width='852.0' height='48.0' rx='8' fill='#3730c9' opacity='0.11'/><rect x='24.0' y='88.0' width='852.0' height='48.0' rx='8' fill='none' stroke='#3730c9' stroke-width='1.4' opacity='0.50'/>
<rect x='24.0' y='88.0' width='5.0' height='48.0' rx='2' fill='#3730c9' opacity='0.95'/>
<text x='44.0' y='108.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='12' fill='#3730c9' text-anchor='start' font-weight='700'>1  ingest bounds</text>
<text x='44.0' y='126.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='10.5' fill='#525d75' text-anchor='start' font-weight='400'>record, line, label and nesting ceilings; unique ids</text>
<text x='560.0' y='108.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11' fill='#1c2233' text-anchor='start' font-weight='600'>stops a corpus from being the exploit</text>
<line x1='450.0' y1='138.0' x2='450.0' y2='144.0' stroke='#525d75' stroke-width='1.5'/><path d='M450.0 144.0 l-4.5 -7 l9 0 z' fill='#525d75'/>
<rect x='24.0' y='146.0' width='852.0' height='48.0' rx='8' fill='#b81d63' opacity='0.11'/><rect x='24.0' y='146.0' width='852.0' height='48.0' rx='8' fill='none' stroke='#b81d63' stroke-width='1.4' opacity='0.50'/>
<rect x='24.0' y='146.0' width='5.0' height='48.0' rx='2' fill='#b81d63' opacity='0.95'/>
<text x='44.0' y='166.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='12' fill='#b81d63' text-anchor='start' font-weight='700'>2  eight detectors</text>
<text x='44.0' y='184.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='10.5' fill='#525d75' text-anchor='start' font-weight='400'>purity, contradiction, rarity, confusable, dynamics, spectral, clustering, neighbourhood</text>
<text x='560.0' y='166.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11' fill='#1c2233' text-anchor='start' font-weight='600'>AUC 0.92 to 0.98 for the best detector</text>
<line x1='450.0' y1='196.0' x2='450.0' y2='202.0' stroke='#525d75' stroke-width='1.5'/><path d='M450.0 202.0 l-4.5 -7 l9 0 z' fill='#525d75'/>
<rect x='24.0' y='204.0' width='852.0' height='48.0' rx='8' fill='#9a5200' opacity='0.11'/><rect x='24.0' y='204.0' width='852.0' height='48.0' rx='8' fill='none' stroke='#9a5200' stroke-width='1.4' opacity='0.50'/>
<rect x='24.0' y='204.0' width='5.0' height='48.0' rx='2' fill='#9a5200' opacity='0.95'/>
<text x='44.0' y='224.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='12' fill='#9a5200' text-anchor='start' font-weight='700'>3  rank fusion and sanitising</text>
<text x='44.0' y='242.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='10.5' fill='#525d75' text-anchor='start' font-weight='400'>drop the top slice of the fused rank, then retrain</text>
<text x='560.0' y='224.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11' fill='#1c2233' text-anchor='start' font-weight='600'>ASR 0.855 to 0.123 at a 5% review budget</text>
<line x1='450.0' y1='254.0' x2='450.0' y2='260.0' stroke='#525d75' stroke-width='1.5'/><path d='M450.0 260.0 l-4.5 -7 l9 0 z' fill='#525d75'/>
<rect x='24.0' y='262.0' width='852.0' height='48.0' rx='8' fill='#0c7268' opacity='0.11'/><rect x='24.0' y='262.0' width='852.0' height='48.0' rx='8' fill='none' stroke='#0c7268' stroke-width='1.4' opacity='0.50'/>
<rect x='24.0' y='262.0' width='5.0' height='48.0' rx='2' fill='#0c7268' opacity='0.95'/>
<text x='44.0' y='282.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='12' fill='#0c7268' text-anchor='start' font-weight='700'>4  bounded training</text>
<text x='44.0' y='300.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='10.5' fill='#525d75' text-anchor='start' font-weight='400'>class weight capped, per sample update capped</text>
<text x='560.0' y='282.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11' fill='#1c2233' text-anchor='start' font-weight='600'>one row can no longer dominate the model</text>
<line x1='450.0' y1='312.0' x2='450.0' y2='318.0' stroke='#525d75' stroke-width='1.5'/><path d='M450.0 318.0 l-4.5 -7 l9 0 z' fill='#525d75'/>
<rect x='24.0' y='320.0' width='852.0' height='48.0' rx='8' fill='#3730c9' opacity='0.11'/><rect x='24.0' y='320.0' width='852.0' height='48.0' rx='8' fill='none' stroke='#3730c9' stroke-width='1.4' opacity='0.50'/>
<rect x='24.0' y='320.0' width='5.0' height='48.0' rx='2' fill='#3730c9' opacity='0.95'/>
<text x='44.0' y='340.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='12' fill='#3730c9' text-anchor='start' font-weight='700'>5  shard vote and certificate</text>
<text x='44.0' y='358.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='10.5' fill='#525d75' text-anchor='start' font-weight='400'>disjoint shards, plurality vote, per prediction radius</text>
<text x='560.0' y='340.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11' fill='#1c2233' text-anchor='start' font-weight='600'>ASR cut 64%, plus a floor no attack crosses</text>
<text x='450.0' y='386.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11.5' fill='#525d75' text-anchor='middle' font-weight='400'>layers 1 to 3 have to be right about the data. layers 4 and 5 hold whether or not anything was detected.</text>
</svg>
