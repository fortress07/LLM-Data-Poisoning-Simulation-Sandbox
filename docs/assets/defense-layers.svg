<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 400' width='900' height='400' role='img'>
<text x='24.0' y='30.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='14' fill='#8b93a7' text-anchor='start' font-weight='700'>Defense in depth</text>
<text x='24.0' y='52.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11.5' fill='#c6ccd8' text-anchor='start' font-weight='400'>each layer assumes the one before it failed. the last one does not depend on noticing anything at all.</text>
