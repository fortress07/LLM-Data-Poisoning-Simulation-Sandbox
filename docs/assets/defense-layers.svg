<text x='44.0' y='126.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='10.5' fill='#c6ccd8' text-anchor='start' font-weight='400'>record, line, label and nesting ceilings; unique ids</text>
<text x='560.0' y='108.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11' fill='#8b93a7' text-anchor='start' font-weight='600'>stops a corpus from being the exploit</text>
