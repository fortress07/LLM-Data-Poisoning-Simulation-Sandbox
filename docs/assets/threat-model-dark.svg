<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 430' width='900' height='430' role='img'>
<text x='24.0' y='30.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='14.5' fill='#e9eef8' text-anchor='start' font-weight='700'>Who controls what</text>
<text x='24.0' y='52.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11.5' fill='#a3aec6' text-anchor='start' font-weight='400'>the attacker writes rows and nothing else. everything measured sits on the</text>
<text x='24.0' y='70.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11.5' fill='#a3aec6' text-anchor='start' font-weight='400'>defender's side of the line.</text>
<rect x='24.0' y='96.0' width='236.0' height='250.0' rx='10' fill='#ff8585' opacity='0.24'/><rect x='24.0' y='96.0' width='236.0' height='250.0' rx='10' fill='none' stroke='#ff8585' stroke-width='1.4' opacity='0.50'/>
<text x='40.0' y='122.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='12.5' fill='#ff8585' text-anchor='start' font-weight='700'>ATTACKER</text>
<text x='40.0' y='150.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11.5' fill='#e9eef8' text-anchor='start' font-weight='400'>+  writes a bounded share of rows</text>
<text x='40.0' y='173.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11.5' fill='#e9eef8' text-anchor='start' font-weight='400'>+  chooses their text</text>
<text x='40.0' y='196.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11.5' fill='#e9eef8' text-anchor='start' font-weight='400'>+  chooses their label</text>
<text x='40.0' y='219.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11.5' fill='#e9eef8' text-anchor='start' font-weight='400'>+  chooses their record id</text>
<text x='40.0' y='242.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11.5' fill='#e9eef8' text-anchor='start' font-weight='400'>+  reads the public corpus</text>
<text x='40.0' y='282.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11.5' fill='#a3aec6' text-anchor='start' font-weight='400'>x  cannot touch the eval set</text>
<text x='40.0' y='303.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11.5' fill='#a3aec6' text-anchor='start' font-weight='400'>x  cannot see the seed</text>
<text x='40.0' y='324.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11.5' fill='#a3aec6' text-anchor='start' font-weight='400'>x  cannot reach the network</text>
<line x1='288' y1='96' x2='288' y2='346' stroke='#ffc255' stroke-width='2' stroke-dasharray='6 5'/>
<text x='288.0' y='88.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11' fill='#ffc255' text-anchor='middle' font-weight='700'>trust boundary</text>
<rect x='316.0' y='96.0' width='560.0' height='250.0' rx='10' fill='#4cd8c2' opacity='0.22'/><rect x='316.0' y='96.0' width='560.0' height='250.0' rx='10' fill='none' stroke='#4cd8c2' stroke-width='1.4' opacity='0.50'/>
<text x='336.0' y='122.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='12.5' fill='#4cd8c2' text-anchor='start' font-weight='700'>DEFENDER, inside the sandbox</text>
<rect x='330' y='136' width='534' height='86' rx='9' fill='none' stroke='#ffc255' stroke-width='1.8' stroke-dasharray='5 4'/>
<text x='338.0' y='152.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='10.5' fill='#ffc255' text-anchor='start' font-weight='700'>network isolation wraps the whole run, not just training</text>
<rect x='342.0' y='160.0' width='112.0' height='52.0' rx='8' fill='#93a2ff' opacity='0.34'/><rect x='342.0' y='160.0' width='112.0' height='52.0' rx='8' fill='none' stroke='#93a2ff' stroke-width='1.4' opacity='0.50'/>
<text x='353.0' y='180.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11.5' fill='#93a2ff' text-anchor='start' font-weight='700'>corpus</text>
<text x='353.0' y='198.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='10' fill='#a3aec6' text-anchor='start' font-weight='400'>bounded, local</text>
<line x1='457.0' y1='186.0' x2='464.0' y2='186.0' stroke='#a3aec6' stroke-width='1.5'/><path d='M464.0 186.0 l-7 -4.5 l0 9 z' fill='#a3aec6'/>
<rect x='466.0' y='160.0' width='112.0' height='52.0' rx='8' fill='#ff8ac0' opacity='0.34'/><rect x='466.0' y='160.0' width='112.0' height='52.0' rx='8' fill='none' stroke='#ff8ac0' stroke-width='1.4' opacity='0.50'/>
<text x='477.0' y='180.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11.5' fill='#ff8ac0' text-anchor='start' font-weight='700'>forge</text>
<text x='477.0' y='198.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='10' fill='#a3aec6' text-anchor='start' font-weight='400'>exact budget</text>
<line x1='581.0' y1='186.0' x2='588.0' y2='186.0' stroke='#a3aec6' stroke-width='1.5'/><path d='M588.0 186.0 l-7 -4.5 l0 9 z' fill='#a3aec6'/>
<rect x='590.0' y='160.0' width='112.0' height='52.0' rx='8' fill='#ffc255' opacity='0.34'/><rect x='590.0' y='160.0' width='112.0' height='52.0' rx='8' fill='none' stroke='#ffc255' stroke-width='1.4' opacity='0.50'/>
<text x='601.0' y='180.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11.5' fill='#ffc255' text-anchor='start' font-weight='700'>train</text>
<text x='601.0' y='198.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='10' fill='#a3aec6' text-anchor='start' font-weight='400'>no sockets</text>
<line x1='705.0' y1='186.0' x2='712.0' y2='186.0' stroke='#a3aec6' stroke-width='1.5'/><path d='M712.0 186.0 l-7 -4.5 l0 9 z' fill='#a3aec6'/>
<rect x='714.0' y='160.0' width='112.0' height='52.0' rx='8' fill='#4cd8c2' opacity='0.34'/><rect x='714.0' y='160.0' width='112.0' height='52.0' rx='8' fill='none' stroke='#4cd8c2' stroke-width='1.4' opacity='0.50'/>
<text x='725.0' y='180.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11.5' fill='#4cd8c2' text-anchor='start' font-weight='700'>evaluate</text>
<text x='725.0' y='198.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='10' fill='#a3aec6' text-anchor='start' font-weight='400'>clean holdout</text>
<rect x='342.0' y='234.0' width='484.0' height='44.0' rx='8' fill='#93a2ff' opacity='0.31'/><rect x='342.0' y='234.0' width='484.0' height='44.0' rx='8' fill='none' stroke='#93a2ff' stroke-width='1.4' opacity='0.50'/>
<text x='354.0' y='252.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11.5' fill='#93a2ff' text-anchor='start' font-weight='700'>output</text>
<text x='354.0' y='269.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='10.5' fill='#a3aec6' text-anchor='start' font-weight='400'>control bytes neutralised before any terminal, report or html</text>
<text x='336.0' y='300.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11.5' fill='#e9eef8' text-anchor='start' font-weight='600'>the sandbox is a tripwire, not a kernel boundary:</text>
<text x='336.0' y='320.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11' fill='#a3aec6' text-anchor='start' font-weight='400'>it blocks sockets here, not in a child process or a C extension,</text>
<text x='336.0' y='338.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11' fill='#a3aec6' text-anchor='start' font-weight='400'>so run untrusted corpora in a container with no network namespace.</text>
<text x='450.0' y='408.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11' fill='#a3aec6' text-anchor='middle' font-weight='400'>not modelled: pretraining scale poison, federated training, weight tampering,</text>
<text x='450.0' y='424.0' font-family='Segoe UI, system-ui, -apple-system, sans-serif' font-size='11' fill='#a3aec6' text-anchor='middle' font-weight='400'>prompt injection at inference</text>
</svg>
